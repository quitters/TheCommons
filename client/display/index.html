<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>The Commons — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  canvas { display: block; }
  /* :not([hidden]) matters: an ID selector unconditionally setting display
     would out-specificity the browser's default [hidden]{display:none},
     leaving this full-screen div invisible but still eating every click. */
  #p5Mount:not([hidden]) { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #p5Mount canvas { width: 100%; height: 100%; object-fit: contain; }
  #status {
    position: fixed; top: 14px; left: 16px; font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.04em; color: var(--ink-dim); opacity: 0.75; pointer-events: none;
    text-shadow: 0 0 6px var(--ground);
  }
  #enableAudio {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--ground); cursor: pointer; text-align: center; padding: 20px;
  }
  #enableAudio .card {
    border: 1px solid var(--coral-dim); border-radius: 12px; padding: 20px 28px;
    font-family: var(--font-body); font-size: 16px; color: var(--ink); max-width: 420px;
  }
  #enableAudio small { display: block; margin-top: 8px; color: var(--ink-dim); font-size: 13px; }
</style>
</head>
<body>
<div id="enableAudio"><div class="card">Click anywhere to enable microphone-driven audio reactivity<small>optional — the piece still runs without it</small></div></div>
<canvas id="c"></canvas>
<div id="p5Mount" hidden></div>
<div id="status"></div>
<!--
  p5.js is loaded ONLY to run the inherited default template library
  (server/templates.js, templates/*.json -- see README's "written from
  scratch" section). Freshly generated sketches never use it; they run on
  the native (ctx, frame, getVar, audio) contract below, no library involved.
-->
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script type="module" src="./display.js"></script>
</body>
</html>
