<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>The Commons — Display</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #p5Mount { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #p5Mount canvas { width: 100%; height: 100%; object-fit: contain; }
  #status {
    position: fixed; top: 10px; left: 10px; color: #7d7; font: 12px monospace;
    opacity: 0.6; pointer-events: none; text-shadow: 0 0 4px #000;
  }
  #enableAudio {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; color: #fff; font: 16px system-ui, sans-serif; cursor: pointer;
    text-align: center; padding: 20px;
  }
</style>
</head>
<body>
<div id="enableAudio">Click anywhere to enable microphone-driven audio reactivity<br/><small style="opacity:0.6">(optional — the piece still runs without it)</small></div>
<canvas id="c"></canvas>
<div id="p5Mount" hidden></div>
<div id="status"></div>
<!--
  p5.js is loaded ONLY to run the inherited default template library
  (server/templates.js, templates/*.json -- see README's "written from
  scratch" section). Freshly generated sketches never use it; they run on
  the native (ctx, frame, getVar, audio) contract below, no library involved.
-->
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script type="module" src="./display.js"></script>
</body>
</html>
