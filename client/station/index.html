<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Commons — Table Station</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
  h1 { font-size: 16px; opacity: 0.7; margin: 0 0 4px; }
  #tableName { opacity: 0.5; font-size: 12px; margin-bottom: 18px; }
  .knob { margin: 18px 0; }
  .knob label { display: block; margin-bottom: 8px; font-size: 15px; }
  .values { display: flex; gap: 8px; flex-wrap: wrap; }
  .values button {
    padding: 12px 16px; border-radius: 10px; border: 1px solid #444; background: #222;
    color: #eee; font-size: 14px; -webkit-tap-highlight-color: transparent;
  }
  .values button.active { background: #4c6ef5; border-color: #4c6ef5; }
  #promptBox { margin-top: 28px; padding-top: 18px; border-top: 1px solid #333; }
  #promptBox textarea { width: 100%; box-sizing: border-box; background: #1a1a1a; color: #eee;
    border: 1px solid #444; border-radius: 8px; padding: 10px; font-size: 14px; }
  #promptBox button { margin-top: 8px; padding: 10px 16px; border-radius: 8px; border: none;
    background: #4c6ef5; color: #fff; font-size: 14px; }
</style>
</head>
<body>
<h1>The Commons</h1>
<div id="tableName"></div>
<div id="knobs"></div>
<div id="promptBox">
  <label style="display:block;margin-bottom:6px;font-size:13px;opacity:0.7;">Or describe a whole new piece for everyone:</label>
  <textarea id="promptInput" rows="2" placeholder="a slow bioluminescent ocean that pulses on the bass"></textarea>
  <button id="promptSend">Remix for the room</button>
</div>
<script type="module" src="./station.js"></script>
</body>
</html>
