<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Commons — Scan to join</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./join-qr.css">
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
main { max-width: 680px; width: 100%; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 4vw, 38px); margin: 0 0 12px; }
.join-card img { width: min(600px, 70vh); max-width: 100%; }
@media print { body { background: white; color: black; } .join-card { border: none; } .join-card p { color: black; } .download { display: none; } }
</style></head><body><main>
<section class="join-card" data-join-card hidden>
<h1>Scan to join The Commons</h1><p>One phone. Your part of a shared canvas.</p>
<a data-join-link><img data-join-image alt="QR code to join the live canvas"></a>
<p>Open your camera, scan, and start shaping the piece.</p>
<p class="download"><a href="./join-qr.png" download>Download QR code</a></p>
</section><p id="joinEmpty">The join code has not been set up yet.</p>
</main><script type="module" src="./join-qr.js"></script></body></html>
